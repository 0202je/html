<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            background-color: aquamarine;
        }
        #calculator{
            width: 350px;
            height: 400px;
            margin-left: 250px;
            margin-top:50px;
            align-items: center;
            background-color: blue;
            border-radius: 16px;
            padding: 25px;
        }
        input[type="text"]{
            width: 100%;
            height: 50px;
            margin-bottom: 20px;
            text-align: right;
            font-size: 1.5rem;
            padding: 0.075rem 0.10rem;
        }
        .btn{
            font-size: 1.6rem;
            padding: 15px;
            background-color: #000000;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            margin-left: 1.2rem;
            cursor: pointer;
            border-radius: 12px;
            margin-bottom: 16px;
        }

         .cal-btn{   
             display: inline-grid;
              grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
              grid-gap: 2rem;
              padding: 2rem 5%;
        #calculator h1{
            width: 10px;
            height:450px;
            text-align: center;
            
        }
        .cal-btn{
            width: 20px;
            height: auto;
            display: inline-grid;
             grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
             grid-gap: 1em;
             padding: 2rem 0.75rem;

        }
        .btn1{
            background-color: #000000;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            margin-left: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
        }
        .btn2{
            background-color: #0da12b;
            color: #282020;
            border: none;
            padding: 1.2rem 1rem;
            margin-left: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        .btn3{
            background-color: #000000;
            color: #fff;
            border: none;
            padding: 1.2rem 1rem;
            margin-left: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        .btn4{
            background-color: #000000;
            color: #fff;
            border: none;
            padding: 1.2rem 3rem; 
            margin-left: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>
      <DIV id="calculator">
        <input type="text" id="display" disabled>
        <h1>CALCULATOR</h1>
        <div class="cal-btn">   
            <div class="operators-btn">
        
                <button onclick="appendOperator ('-')"" type="button" class="btn1">-</button>   
                <button onclick="appendOperator('+')" type="button" class="btn1">+</button>
                <button onclick="appendOperator('*')" type="button" class="btn1">x</button>
                <button onclick="appendOperator('/')"" type="button" class="btn1">/</button>

            </div>

            <div class="numbers-btn">

                <button onclick="appendNumber('9')" type="button" class="btn2">9</button>
                <button onclick="appendNumber('8')" type="button" class="btn2">8</button>
                <button onclick="appendNumber('7')" type="button" class="btn2">7</button>
                <button onclick="appendNumber('6')" type="button" class="btn2">6</button>

                <button onclick="appendNumber('5')" type="button" class="btn2">5</button>
                <button onclick="appendNumber('4')" type="button" class="btn2">4</button>
                <button onclick="appendNumber('3')" type="button" class="btn2">3</button>
                <button onclick="appendNumber('2')" type="button" class="btn2">2</button>

                <button onclick="appendNumber('1')" type="button" class="btn2">1</button>
                <button onclick="appendNumber('0')" type="button" class="btn2">0</button>    
                <button onclick="appendNumber('.')" type="button" class="btn2">.</button>
                <button onclick="clearDisplay()" type="button" class="btn3">C</button>

                </div>

                <div class="equal-sign-button">

                <button type="button" class="btn4">=</button>

                </div>
        </div>
        

      </DIV>
    
</body>
</html>
